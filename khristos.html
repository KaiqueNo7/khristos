<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khristós</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Texturina:opsz,wght@12..72,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="viewport">
  <div id="stage" data-screen="title" data-turn="0">
    <div class="table"></div>
    <div class="light"></div>
    <div class="grain"></div>

    <section class="screen" id="screen-title">
      <svg class="chirho" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M50 10v80"/><path d="M50 10c24 0 24 32 0 32"/><path d="M22 36l56 46M78 36L22 82"/></g></svg>
      <h1 class="wordmark">Khristós</h1>
      <p class="tagline">Uma disputa de fé, zona a zona.</p>
      <p class="lede" id="title-lede"></p>
      <div class="title-actions">
        <button class="btn btn--solid" id="btn-play">Jogar</button>
        <button class="btn" data-open="rules">Como se joga</button>
        <button class="btn" data-open="ladder">A hierarquia</button>
        <a class="btn" href="view-cards.html">Ver as cartas</a>
      </div>
    </section>

    <section class="screen" id="screen-decks">
      <h2 class="screen-title">Quem conduz a sua Igreja?</h2>
      <p class="screen-sub">O outro Santo fica com o oponente.</p>
      <div class="decks" id="decks"></div>
      <button class="btn" id="btn-back">Voltar</button>
    </section>

    <section class="screen" id="screen-game">
      <div id="enemy-hand" aria-hidden="true"></div>

      <aside id="side-left">
        <div class="seat seat--enemy" id="seat-1"></div>
        <div id="log" aria-live="polite"></div>
        <div class="seat seat--me" id="seat-0"></div>
      </aside>

      <div id="board"></div>

      <aside id="side-right">
        <div class="roundbox">
          <span>Rodada</span>
          <b id="round-no">1</b>
        </div>
        <div class="tools">
          <button class="tool" id="btn-sound" title="Ligar ou desligar o som">Som</button>
          <button class="tool" id="btn-pace" title="Velocidade das animações">Ritmo</button>
          <button class="tool" data-open="rules" title="Regras">Regras</button>
          <button class="tool" data-open="ladder" title="A hierarquia">Hierarquia</button>
        </div>
        <button class="endturn" id="btn-end">Encerrar turno</button>
        <div id="forecast"></div>
        <div class="piles">
          <div class="pile pile--deck" id="pile-deck" title="Seu baralho"><b></b><span>Baralho</span></div>
          <button class="pile pile--retiro" id="pile-retiro" title="Ver o Retiro"><b></b><span>Retiro</span></button>
        </div>
      </aside>

      <div id="hand"></div>
      <div id="hint"></div>
    </section>

    <div id="ghosts"></div>
    <div id="preview" hidden></div>
    <div id="actionbar" hidden></div>

    <div id="banner" hidden><div class="banner__band"><b></b><span></span></div></div>

    <div id="cinema" hidden>
      <div class="cinema__rays"></div>
      <div class="cinema__card"></div>
      <div class="cinema__title"><b></b><span></span></div>
    </div>

    <div id="mulligan" hidden>
      <h2 class="screen-title">Sua mão inicial</h2>
      <p class="screen-sub">Marque as cartas que quer trocar. A troca acontece uma vez só.</p>
      <div class="mulligan__cards"></div>
      <button class="btn btn--solid" id="btn-mulligan">Manter esta mão</button>
    </div>

    <div id="endgame" hidden>
      <div class="cinema__rays"></div>
      <h2></h2>
      <p></p>
      <div class="title-actions">
        <button class="btn btn--solid" id="btn-again">Jogar de novo</button>
        <button class="btn" id="btn-switch">Trocar de Santo</button>
      </div>
    </div>

    <div id="modal" hidden>
      <div class="modal__box">
        <button class="modal__close" aria-label="Fechar">Fechar</button>
        <div class="modal__body"></div>
      </div>
    </div>

    <div id="toast" hidden></div>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<script type="module" src="js/main.js"></script>
</body>
</html>
